<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Gold shamrock on Notre Dame navy. Vector, so it is sharp at 16px in a
       tab and at 512px on a home screen alike. One heart-shaped leaf, rotated
       three times about the centre; shapes are fat because thin strokes
       vanish at favicon size. -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#0C2340" stroke="#E3B84A" stroke-width="3"/>
  <defs>
    <g id="leaf" fill="#C99700">
      <circle cx="-6.5" cy="-14" r="8"/>
      <circle cx="6.5" cy="-14" r="8"/>
      <path d="M-13 -11 L0 2 L13 -11 Z"/>
    </g>
  </defs>
  <g transform="translate(32 30)">
    <use href="#leaf"/>
    <use href="#leaf" transform="rotate(120)"/>
    <use href="#leaf" transform="rotate(240)"/>
    <circle r="4.5" fill="#C99700"/>
    <!-- stem, down through the gap between the two lower leaves -->
    <path d="M-2.5 2 C-2.5 12 -1 20 4 27 L0 29 C-5.5 22 -7 13 -7 2 Z" fill="#C99700"/>
  </g>
</svg>
