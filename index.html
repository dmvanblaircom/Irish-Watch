<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Irish Watch — Notre Dame football</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=Grenze+Gotisch:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    /* NOTE: --ink is the palette base, but the page background is written as the
       literal #0A1B33 in three places below so a host webview cannot override it.
       Change the colour here AND in those three spots. */
    --ink:#0A1B33; --ink-2:#102844; --ink-3:#294A6E;
    --leaf:#C5A24A;                    /* gold, 7.1:1 on ink */
    --gold-dark:#B8952F;               /* darkest gradient stop */
    --gold-light:#F0DBA0;              /* lightest gradient stop */
    --on-gold:#2E2306;                 /* 5.4:1 on the darkest gold */
    --on-gold-2:#3A2D08;               /* 4.7:1 on the darkest gold */
    --parch:#F2EFE6; --dim:#9DAABC;    /* dim = 7.3:1 on ink */
    --win:#6FD69B;                     /* 5.3:1 on ink */
    --loss:#F5A79C;                    /* 4.9:1 on ink */
    --live-bg:#A3382E;                 /* 6.6:1 against white text */
    --live-fg:#FFFFFF; --live-fg-2:#FFD9D3;
    --neutral:#7FC8E8;                 /* 5.1:1 on ink */
    --live:#FF5A4E;                    /* broadcast red, 5.1:1 on the page navy */
    --inplay:#4FAE78;                  /* live play text, 5.8:1 on the page navy.
                                          Notre Dame's own #0A843D is only 3.3:1,
                                          so this is that hue lifted to pass. */
    --focus:#FFD966;
  }
  *{box-sizing:border-box}
  /* Some embedded webviews force a light canvas. Declare the scheme, then paint
     the background on html, body AND a full-height wrapper so at least one wins. */
  :root{color-scheme:dark}
  html,body{margin:0;padding:0;background-color:#0A1B33 !important}
  body{
    color:var(--parch);
    font-family:'Barlow',system-ui,-apple-system,sans-serif;
    font-size:1rem; line-height:1.5; -webkit-font-smoothing:antialiased;
  }
  .page{background-color:#0A1B33;min-height:100vh;min-height:100dvh;padding-bottom:3rem}
  @media (prefers-color-scheme:light){
    html,body,.page{background-color:#0A1B33 !important;color:#F2EFE6}
  }
  .wrap{max-width:38rem;margin:0 auto;padding:0 1rem}

  /* 2.4.7 — one visible focus style everywhere, never removed */
  :focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:2px}

  .sr-only{
    position:absolute;width:1px;height:1px;padding:0;margin:-1px;
    overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;
  }
  .skip{
    position:absolute;left:1rem;top:-4rem;z-index:10;
    background:var(--leaf);color:#231A03;font-weight:600;
    padding:.75rem 1rem;border-radius:3px;text-decoration:none;
  }
  .skip:focus{top:.75rem}

  /* header */
  .bar{display:flex;align-items:center;gap:.6rem;padding:.75rem 0 .6rem;flex-wrap:wrap}
  .bar h1{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:1.4rem;margin:0;color:var(--leaf);letter-spacing:.02em}
  .bar .rank{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:.9rem;color:#231A03;background:var(--leaf);padding:.1rem .45rem;border-radius:2px}
  .bar .rec{font-size:.9rem;color:var(--dim);font-variant-numeric:tabular-nums}
  .bar .spacer{flex:1}
  /* 2026 team motto. One line to change next season.
     Grenze Gotisch keeps the gothic character but with open counters and
     roman-derived shapes, so it reads at a glance. Mixed case on purpose —
     uppercase gothic is much harder to parse. */
  .motto{
    margin:0;padding:.35rem 0 .6rem;text-align:center;
    font-family:'Grenze Gotisch','Barlow Condensed',serif;font-weight:700;
    /* Scales with the viewport but stops growing once the wrap hits its
       38rem cap, so it fills a phone without ballooning on a desktop.
       cqw would be cleaner; vw is the safe version for older Safari. */
    font-size:clamp(2rem,11.5vw,4.1rem);
    line-height:1.02;letter-spacing:.01em;
    text-wrap:balance;
    color:var(--leaf);
    border-bottom:1px solid var(--ink-3);
  }
  /* Very narrow phones: let it break to two lines rather than overflow. */
  @media (max-width:22rem){ .motto{font-size:2.6rem;line-height:1.05} }
  /* 2.5.5 — 44px minimum target */
  .refresh{
    min-height:2.75rem;min-width:5.5rem;
    background:none;border:1px solid var(--ink-3);color:var(--parch);
    font-family:inherit;font-size:.9rem;padding:0 .9rem;border-radius:3px;cursor:pointer;
  }
  .refresh:hover{border-color:var(--leaf);color:var(--leaf)}

  /* hero */
  .hero{
    position:relative;
    margin:1rem 0 0;padding:1.25rem 1.1rem 1.1rem;border-radius:3px 3px 0 0;overflow:hidden;
    background:linear-gradient(103deg,var(--gold-dark) 0%,var(--leaf) 20%,var(--gold-light) 36%,
      var(--leaf) 50%,var(--gold-dark) 64%,var(--leaf) 80%,var(--gold-light) 93%,var(--leaf) 100%);
    color:var(--on-gold);
    box-shadow:0 1px 0 rgba(255,255,255,.35) inset;
    opacity:0;animation:reveal .7s cubic-bezier(.2,.7,.3,1) forwards;
  }
  @keyframes reveal{from{opacity:0;transform:translateY(.4rem)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.hero{animation:none;opacity:1}}
  .hero .when,.hero .opp{padding-right:5.5rem}
  .hero .when{font-size:.78rem;font-weight:600;letter-spacing:.08em;color:var(--on-gold-2)}
  .hero .opp{font-family:'Barlow Condensed',sans-serif;font-weight:700;
    font-size:clamp(1.9rem,8vw,2.6rem);line-height:1.03;letter-spacing:-.01em;margin:.15rem 0 .5rem}
  .hero .opp .vs{font-weight:500;opacity:.75;font-size:.62em;margin-right:.35rem}
  .hero .line{font-size:.95rem;font-weight:500}
  .hero .line b{font-weight:600}
  .hero .venue{font-size:.85rem;color:var(--on-gold-2);margin-top:.1rem}
  .hero .series{font-size:.9rem;font-weight:600;margin:.4rem 0 0;padding-right:5.5rem}
  .hero .clock{margin-top:.85rem;padding-top:.75rem;border-top:1px solid rgba(46,35,6,.35);
    font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:1.6rem;font-variant-numeric:tabular-nums}
  .hero .clock small{font-size:.5em;font-weight:600;margin-left:.1rem;margin-right:.55rem}
  .hero .spread{position:absolute;top:1.25rem;right:1.1rem;margin:0;font-size:.9rem;font-weight:600;line-height:1.35;text-align:right;font-variant-numeric:tabular-nums}
  .hero.live{background:var(--live-bg);color:var(--live-fg);box-shadow:none}
  .hero.live .when,.hero.live .venue{color:var(--live-fg-2)}
  .hero.live .clock{border-top-color:rgba(255,255,255,.4)}

  /* market strip */
  .strip{display:flex;background:var(--ink-2);border:1px solid var(--ink-3);border-top:none;
    border-radius:0 0 3px 3px;margin-bottom:1.25rem}
  .strip > div{flex:1;padding:.6rem .75rem;border-right:1px solid var(--ink-3);
    display:flex;flex-direction:column;justify-content:space-between;gap:.25rem}
  .strip > div:last-child{border-right:none}
  .strip dt{font-size:.72rem;letter-spacing:.06em;color:var(--dim);font-weight:600;
    line-height:1.25;text-wrap:balance}
  .strip dd{margin:0;font-family:'Barlow Condensed',sans-serif;font-weight:700;
    font-size:1.4rem;line-height:1.1;font-variant-numeric:tabular-nums}
  .strip dd.pending{font-size:.95rem;font-weight:500;color:var(--dim);
    font-family:'Barlow',system-ui,sans-serif}
  .strip dd em{font-style:normal;font-size:.6em;font-weight:600;margin-left:.3rem}
  .up{color:var(--win)} .down{color:var(--loss)}

  /* tabs */
  [role="tablist"]{display:flex;gap:2px;border-bottom:1px solid var(--ink-3)}
  [role="tablist"]{overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  [role="tablist"]::-webkit-scrollbar{display:none}
  [role="tab"]{flex:1 0 auto;min-width:4.2rem;min-height:2.75rem;background:none;border:none;
    border-bottom:3px solid transparent;color:var(--parch);
    font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:.95rem;
    letter-spacing:.03em;padding:.5rem .15rem;cursor:pointer;white-space:nowrap}
  [role="tab"][aria-selected="false"]{color:var(--dim)}
  [role="tab"][aria-selected="true"]{color:var(--leaf);border-bottom-color:var(--leaf)}
  [role="tabpanel"]{padding-top:.15rem}
  [role="tabpanel"]:focus:not(:focus-visible){outline:none}

  /* lists */
  ul.plain,ol.plain{list-style:none;margin:0;padding:0}
  .row{display:flex;align-items:center;gap:.75rem;padding:.8rem .15rem;border-bottom:1px solid var(--ink-3)}
  .row .date{width:3.2rem;flex:none;text-align:center;font-family:'Barlow Condensed',sans-serif;line-height:1.05}
  .row .date .m,.row .date .d{display:block}
  .row .date .m{font-size:.72rem;font-weight:600;color:var(--dim);letter-spacing:.06em;text-transform:uppercase}
  .row .date .d{font-size:1.3rem;font-weight:700}
  .row .mid{flex:1;min-width:0}
  .row .team,.row .sub,.row .score,.row .wl,.row .status{display:block}
  .row .team{font-weight:500;font-size:1rem}
  .row .team .pre,.row .team .rk{display:inline}
  .row .team .pre{color:var(--dim);font-weight:400;margin-right:.3rem}
  .row .sub{font-size:.82rem;color:var(--dim);margin-top:.1rem}
  .row .right{flex:none;text-align:right;font-family:'Barlow Condensed',sans-serif}
  .row .score{font-size:1.2rem;font-weight:700;font-variant-numeric:tabular-nums}
  .row .wl{font-size:.78rem;font-weight:600;letter-spacing:.04em}
  .row .wl.w{color:var(--win)} .row .wl.l{color:var(--loss)}
  .row .status{font-size:.78rem;font-weight:600;color:var(--dim)}
  .row .net{display:inline-block;font-size:.78rem;font-weight:600;color:var(--leaf);
    border:1px solid var(--leaf);border-radius:2px;padding:.15rem .4rem;white-space:nowrap}
  .row .net.tbd{color:var(--dim);border-color:var(--dim)}
  .row.past{opacity:.85}
  .row.next,.row.nd{background:rgba(197,162,74,.14);margin:0 -.5rem;padding-left:.65rem;padding-right:.65rem;
    border-left:3px solid var(--leaf)}
  .rk{color:var(--leaf);font-weight:600;font-size:.88em;margin-right:.15rem}
  /* HOME / AWAY / NEUTRAL. Filled for home so the ones you can drive to pop. */
  .tag{display:inline-block;font-family:'Barlow Condensed',sans-serif;font-weight:700;
    font-size:.7rem;letter-spacing:.07em;line-height:1;padding:.22rem .34rem;
    border-radius:2px;border:1px solid;vertical-align:.08em;margin-right:.4rem}
  .tag.h{color:#231A03;background:var(--leaf);border-color:var(--leaf)}
  .tag.a{color:var(--dim);background:none;border-color:var(--dim)}
  .tag.n{color:var(--neutral);background:none;border-color:var(--neutral)}
  .trophy{display:block;font-size:.78rem;font-weight:600;color:var(--leaf);margin-top:.12rem}

  /* odds board */
  .obar{display:flex;align-items:center;gap:.65rem;padding:.65rem .15rem;border-bottom:1px solid var(--ink-3)}
  .obar .orank{width:1.4rem;flex:none;text-align:right;font-family:'Barlow Condensed',sans-serif;
    font-weight:700;color:var(--dim);font-variant-numeric:tabular-nums;font-size:.9rem}
  .obar .nm{flex:1;font-weight:500}
  .obar .track{width:6rem;flex:none;height:.5rem;background:var(--ink-2);
    border:1px solid var(--ink-3);border-radius:3px;overflow:hidden}
  .obar .fill{display:block;height:100%;background:var(--leaf)}
  .obar .pc{width:3rem;flex:none;text-align:right;font-family:'Barlow Condensed',sans-serif;
    font-weight:700;font-size:1.2rem;font-variant-numeric:tabular-nums}
  .obar.nd{background:rgba(197,162,74,.14);margin:0 -.5rem;padding-left:.65rem;padding-right:.65rem;
    border-left:3px solid var(--leaf)}
  .obar.nd .nm{color:var(--leaf);font-weight:600}

  /* depth chart */
  .depth-pos{display:flex;align-items:baseline;gap:.5rem;margin:.9rem 0 .2rem}
  .depth-pos b{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:1rem;
    letter-spacing:.05em;color:var(--leaf)}
  .depth-pos .battle{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.7rem;
    letter-spacing:.07em;color:var(--ink);background:var(--leaf);padding:.12rem .35rem;border-radius:2px}
  ul.ladder{list-style:none;margin:0;padding:0}
  ul.ladder li{display:flex;align-items:baseline;gap:.5rem;padding:.3rem .15rem;
    border-bottom:1px solid var(--ink-3)}
  ul.ladder li.d1{font-weight:600}
  ul.ladder li.d2,ul.ladder li.d3,ul.ladder li.d4{color:var(--dim);padding-left:1rem}
  ul.ladder .jersey{width:2rem;flex:none;text-align:right;font-family:'Barlow Condensed',sans-serif;
    font-weight:700;color:var(--dim);font-variant-numeric:tabular-nums}
  ul.ladder .nm{flex:1}
  ul.ladder .cl{flex:none;font-size:.8rem;color:var(--dim)}
  ul.ladder .ortag{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.68rem;
    letter-spacing:.06em;color:var(--leaf);border:1px solid var(--leaf);border-radius:2px;
    padding:.05rem .25rem}
  .avail li{display:flex;gap:.55rem;padding:.4rem .15rem;border-bottom:1px solid var(--ink-3)}
  .avail .who{flex:1}
  .avail .part{flex:none;color:var(--dim);font-size:.85rem}
  .avail .pos{color:var(--dim);font-size:.85rem;margin-right:.3rem}
  .chg{margin:0;padding:0 0 0 1.05rem}
  .chg li{padding:.22rem 0;font-size:.92rem}
  .avail .weeks{flex:none;font-size:.78rem;color:var(--leaf);font-weight:600}
  .avail li{flex-wrap:wrap}
  .newer{flex-basis:100%;margin:.3rem 0 .1rem;padding:.4rem .5rem;
    background:var(--ink-2);border-left:2px solid var(--neutral);border-radius:0 2px 2px 0;
    font-size:.82rem;line-height:1.4}
  .newer b{color:var(--neutral);font-weight:600}
  .newer a{color:var(--parch)}
  .asof{font-size:.82rem;color:var(--dim);padding:.1rem .15rem .5rem}
  details.week{border-bottom:1px solid var(--ink-3)}
  details.week summary{padding:.6rem .15rem;cursor:pointer;display:flex;gap:.6rem;align-items:baseline}
  details.week summary::-webkit-details-marker{display:none}
  details.week summary .wd{font-family:'Barlow Condensed',sans-serif;font-weight:700;
    color:var(--leaf);width:4.2rem;flex:none}
  details.week summary .ws{flex:1;color:var(--dim);font-size:.88rem}
  details.week[open] summary .ws{color:var(--parch)}
  details.week .chg{padding:0 0 .6rem 1.6rem}
  /* one collapsible pattern used across every tab */
  details.fold{border-bottom:1px solid var(--ink-3)}
  details.fold > summary{
    display:flex;align-items:baseline;gap:.5rem;cursor:pointer;
    padding:.7rem .15rem;min-height:2.75rem;box-sizing:border-box;
    font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:1rem;
    letter-spacing:.04em;color:var(--parch);
  }
  details.fold > summary::-webkit-details-marker{display:none}
  details.fold > summary::after{
    content:"\25BE";margin-left:auto;color:var(--leaf);font-size:.85rem;
    transition:transform .15s ease;
  }
  details.fold[open] > summary::after{transform:rotate(180deg)}
  @media (prefers-reduced-motion:reduce){details.fold > summary::after{transition:none}}
  details.fold > summary .count{font-weight:500;color:var(--dim);font-size:.85rem;letter-spacing:0}
  details.fold > summary:focus-visible{outline:3px solid var(--focus);outline-offset:-3px}
  details.fold .foldbody{padding-bottom:.5rem}
  .more{
    display:block;width:100%;min-height:2.75rem;margin:.6rem 0 0;
    background:none;border:1px solid var(--ink-3);border-radius:3px;color:var(--parch);
    font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:.95rem;
    letter-spacing:.04em;cursor:pointer;
  }
  .more:hover{border-color:var(--leaf);color:var(--leaf)}

  .pollnote{font-size:.82rem;color:var(--dim);padding:.55rem .15rem}
  /* live game view */
  .gscore{display:flex;align-items:center;gap:.6rem;padding:.8rem .15rem;border-bottom:1px solid var(--ink-3)}
  .gscore .side{flex:1;min-width:0}
  .gscore .side .nm{font-weight:600;font-size:1.05rem}
  .gscore .side .rec{font-size:.8rem;color:var(--dim)}
  .gscore .pts{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:2rem;
    font-variant-numeric:tabular-nums;line-height:1}
  .gscore.lead .pts{color:var(--leaf)}
  .gstatus{display:flex;align-items:baseline;gap:.5rem;padding:.5rem .15rem;font-size:.9rem}
  .gstatus .dot{width:.5rem;height:.5rem;border-radius:50%;background:var(--inplay);flex:none;
    animation:pulse 1.6s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  @media (prefers-reduced-motion:reduce){.gstatus .dot{animation:none}}
  .lastplay{margin:.5rem 0;padding:.7rem .8rem;background:var(--ink-2);
    border-left:3px solid var(--inplay);border-radius:0 3px 3px 0}
  .lastplay .k{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.72rem;
    letter-spacing:.08em;color:var(--inplay)}
  .lastplay .t{font-size:.95rem;line-height:1.45;margin-top:.2rem}
  .lastplay .dd{font-size:.82rem;color:var(--dim);margin-top:.3rem}
  .statrow{display:flex;align-items:center;gap:.6rem;padding:.42rem .15rem;border-bottom:1px solid var(--ink-3);
    font-variant-numeric:tabular-nums}
  .statrow .lbl{flex:1;text-align:center;font-size:.82rem;color:var(--dim)}
  .statrow .v{width:4.2rem;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:1rem}
  .statrow .v.r{text-align:right}
  .statrow .v.win{color:var(--leaf)}
  .statrow.head{border-bottom:2px solid var(--leaf);padding-bottom:.35rem;margin-top:.1rem}
  .statrow.head .v{font-size:1rem;letter-spacing:.05em;color:var(--parch)}
  .statrow.head .v.nd{color:var(--leaf)}
  .statrow.head .lbl{font-family:'Barlow Condensed',sans-serif;font-size:.72rem;
    letter-spacing:.09em;color:var(--dim)}
  .linescore{width:100%;border-collapse:collapse;margin:.3rem 0 .2rem;font-variant-numeric:tabular-nums}
  .linescore th,.linescore td{padding:.35rem .3rem;text-align:center;border-bottom:1px solid var(--ink-3);
    font-size:.9rem}
  .linescore th{font-family:'Barlow Condensed',sans-serif;font-weight:600;color:var(--dim);font-size:.78rem;
    letter-spacing:.05em}
  .linescore td:first-child,.linescore th:first-child{text-align:left;font-weight:600}
  .linescore td.tot{font-weight:700;color:var(--leaf)}
  .ldr{display:flex;gap:.7rem;padding:.5rem .15rem;border-bottom:1px solid var(--ink-3);font-size:.95rem}
  .ldr .cat{width:5.2rem;flex:none;font-family:'Barlow Condensed',sans-serif;font-weight:600;
    color:var(--dim);font-size:.8rem;letter-spacing:.05em;padding-top:.12rem}
  .ldr .who{flex:1;min-width:0}
  .ldr .nm{display:block;font-weight:600}
  .ldr .line{display:block;color:var(--dim);font-size:.85rem;margin-top:.1rem}
  /* away | home switch, so the team code does not repeat on every row */
  .seg{display:flex;gap:0;margin:.1rem 0 .2rem;border:1px solid var(--ink-3);border-radius:4px;overflow:hidden}
  .seg button{flex:1;min-height:2.6rem;background:none;border:none;cursor:pointer;
    font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.95rem;letter-spacing:.06em;
    color:var(--dim);padding:.4rem .5rem}
  .seg button+button{border-left:1px solid var(--ink-3)}
  .seg button[aria-pressed="true"]{background:var(--leaf);color:#231A03}
  .seg button:focus-visible{outline:3px solid var(--focus);outline-offset:-3px}
  .seg .sub{display:block;font-family:'Barlow',sans-serif;font-weight:500;font-size:.68rem;
    letter-spacing:.04em;opacity:.75}
  /* single-line variant, for switching a whole section */
  .seg.pills{margin:.7rem 0 .3rem}
  .seg.pills button{min-height:2.5rem;font-size:.92rem;letter-spacing:.05em}
  .seg.pills .n{font-weight:600;opacity:.7;margin-left:.35rem;font-size:.85em}
  /* which poll, shown as options rather than hidden behind accordions */
  .seg.pills.polls{margin:.15rem 0 .2rem}
  .seg.pills.roster{margin:.2rem 0 .35rem}
  .seg.pills.roster button{font-size:.85rem;min-width:0;padding:.4rem .25rem;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .seg.pills.roster .n{margin-left:.25rem}
  .seg.pills.polls button{font-size:.88rem;letter-spacing:.04em}
  .seg.pills.polls .n{margin-left:.3rem;opacity:.85}
  .scorply{display:flex;gap:.55rem;padding:.5rem .15rem .5rem .55rem;
    border-bottom:1px solid var(--ink-3);font-size:.88rem;
    border-left:3px solid transparent}
  .scorply.byus{border-left-color:var(--leaf);background:rgba(201,151,0,.07)}
  .scorply.bythem{border-left-color:var(--ink-3)}
  .scorply .qc{width:3.2rem;flex:none;color:var(--dim);font-size:.78rem;padding-top:.1rem}
  .scorply .tm{flex:none;width:2.6rem;font-family:'Barlow Condensed',sans-serif;font-weight:700;

  /* ---- iOS standalone safe areas ----
     apple-mobile-web-app-status-bar-style is black-translucent, which is what
     lets the navy run edge to edge behind the clock. The cost is that the web
     view starts at y=0, so the header sits under the status bar unless we
     reserve the inset ourselves. In normal Safari these all evaluate to 0. */
  .page{
    /* the safe-area inset moved onto .bar so the sticky header can paint
       behind the status bar instead of leaving a transparent strip */
    padding-top:0;
    padding-bottom:calc(5.2rem + env(safe-area-inset-bottom, 0px));
  }
  .wrap{
    padding-left:calc(.85rem + env(safe-area-inset-left, 0px));
    padding-right:calc(.85rem + env(safe-area-inset-right, 0px));
  }
  /* A little air between the status bar and the wordmark in standalone mode. */
  /* header stays put so Refresh is always a thumb away */
  .bar{
    position:sticky;top:0;z-index:55;
    padding-top:calc(.7rem + env(safe-area-inset-top, 0px));
    padding-bottom:.55rem;
    margin-left:calc(-1 * (.85rem + env(safe-area-inset-left, 0px)));
    margin-right:calc(-1 * (.85rem + env(safe-area-inset-right, 0px)));
    padding-left:calc(.85rem + env(safe-area-inset-left, 0px));
    padding-right:calc(.85rem + env(safe-area-inset-right, 0px));
    background:rgba(7,25,47,.94);
    -webkit-backdrop-filter:saturate(160%) blur(14px);
    backdrop-filter:saturate(160%) blur(14px);
    border-bottom:1px solid var(--ink-3);
  }
  /* a dot on Refresh while something is actually live and polling */
  /* .page uses overflow:hidden to clip its decorative circle, but that makes it
     a scroll container and position:sticky then has nothing to stick to.
     overflow:clip clips without creating one. */
  .page{overflow:visible;overflow-x:clip}

  /* The redesign's 4px gold rule lives on .page::before, absolutely positioned
     at the top of the page. The sticky header sits over it, and because the
     header is 94% opaque the gold bled through and then scrolled away, which
     reads as the header shifting. Pin the rule to the viewport instead so it
     never moves, and put it above the header. */
  .page::before{position:fixed;z-index:70}

  /* Opaque enough that nothing behind it ghosts through as content scrolls
     underneath, and promoted to its own layer up front so Safari does not
     re-composite it at the moment it becomes stuck. */
  .bar{
    background:rgba(7,25,47,.985);
    transform:translateZ(0);
    -webkit-transform:translateZ(0);
    will-change:transform;
  }
  #refresh.polling::before{
    content:"";display:inline-block;width:.42rem;height:.42rem;border-radius:50%;

  .strip{align-items:stretch}
